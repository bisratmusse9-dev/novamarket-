<!DOCTYPE html>
<html>
<head>
  <title>Nova Market</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 10px;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: 30px;
    }

    nav button {
      padding: 10px 18px;
      margin: 4px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
    }

    main {
      padding: 35px 15px;
      text-align: center;
    }

    .card {
      background: white;
      max-width: 400px;
      margin: 25px auto;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #ccc;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .submit {
      background: #111827;
      color: white;
      padding: 12px 25px;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>

  <h1>🚀 Nova Market</h1>

  <nav>
    <button type="button" onclick="home()">Home</button>
    <button type="button" onclick="login()">Login</button>
    <button type="button" onclick="signup()">Sign Up</button>
  </nav>

</header>

<main id="content">

  <h2>Welcome to Nova Market 🛒</h2>
  <p>Your online marketplace.</p>

</main>

<script>

function home() {

  document.getElementById("content").innerHTML =
    "<h2>Welcome to Nova Market 🏠</h2>" +
    "<p>Find amazing products here.</p>";

}

function signup() {

  document.getElementById("content").innerHTML =
    '<div class="card">' +
    '<h2>Create Account 📝</h2>' +

    '<input id="name" placeholder="Name">' +
    '<input id="email" placeholder="Email">' +
    '<input id="password" type="password" placeholder="Password">' +

    '<button class="submit" type="button" onclick="createAccount()">Create Account</button>' +

    '<div id="message" class="message"></div>' +

    '</div>';

}

function createAccount() {

  var name = document.getElementById("name").value;
  var email = document.getElementById("email").value;
  var password = document.getElementById("password").value;

  if (name == "" ⠞⠟⠞⠟⠟⠵⠞⠵⠺⠺⠞⠺⠟ password == "") {

    document.getElementById("message").innerHTML =
      "Please fill in all fields.";

    return;

  }

  localStorage.setItem("novaName", name);
  localStorage.setItem("novaEmail", email);
  localStorage.setItem("novaPassword", password);

  document.getElementById("message").innerHTML =
    "Account created! 🎉";

}

function login() {

  document.getElementById("content").innerHTML =
    '<div class="card">' +
    '<h2>Login 🔐</h2>' +

    '<input id="loginEmail" placeholder="Email">' +
    '<input id="loginPassword" type="password" placeholder="Password">' +

    '<button class="submit" type="button" onclick="checkLogin()">Login</button>' +

    '<div id="message" class="message"></div>' +

    '</div>';

}

function checkLogin() {

  var email = document.getElementById("loginEmail").value;
  var password = document.getElementById("loginPassword").value;

  var savedEmail = localStorage.getItem("novaEmail");
  var savedPassword = localStorage.getItem("novaPassword");
  var savedName = localStorage.getItem("novaName");

  if (email == savedEmail && password == savedPassword) {

    document.getElementById("message").innerHTML =
      "Welcome back, " + savedName + "! 🎉";

  } else {

    document.getElementById("message").innerHTML =
      "Wrong email or password.";

  }

}

</script>

</body>
</html>
