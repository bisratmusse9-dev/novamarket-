function loginAccount() {

  var email = document.getElementById("loginEmail").value;
  var password = document.getElementById("loginPassword").value;

  if (
    email == localStorage.getItem("novaEmail") &&
    password == localStorage.getItem("novaPassword")
  ) {

    document.getElementById("loginMessage").innerHTML =
      "Welcome back! 🎉";

  } else {

    document.getElementById("loginMessage").innerHTML =
      "Wrong email or password.";
  }
}

function addProduct() {

  var name = document.getElementById("sellerName").value;
  var price = document.getElementById("sellerPrice").value;

  if (name == "" || price == "") {

    document.getElementById("sellerMessage").innerHTML =
      "Enter the product name and price.";

    return;
  }

  products.push({
    id: products.length + 1,
    name: name,
    price: price,
    category: "Other",
    icon: "🛍️",
    rating: 5
  });

  document.getElementById("sellerMessage").innerHTML =
    "Product added! 🎉";
}
