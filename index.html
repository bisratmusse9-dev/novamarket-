<!DOCTYPE html>
<html>
<head>
<title>Nova Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{background:#111;color:white;padding:20px;text-align:center}
button{padding:12px 20px;margin:5px;border:0;border-radius:6px;background:white;color:#111;cursor:pointer}
main{text-align:center;padding:30px}
.box{background:white;padding:25px;max-width:350px;margin:auto;border-radius:10px}
input{display:block;width:90%;padding:12px;margin:10px auto}
</style>
</head>

<body>

<header>
<h1>🚀 Nova Market</h1>
<button onclick="showHome()">Home</button>
<button onclick="showLogin()">Login</button>
<button onclick="showSignup()">Sign Up</button>
</header>

<main id="page">
<h2>Welcome to Nova Market 🛒</h2>
<p>Buy and sell amazing products.</p>
</main>

<script>
function showHome(){
document.getElementById("page").innerHTML =
"<h2>Welcome Home 🏠</h2><p>Welcome to Nova Market!</p>";
}

function showLogin(){
document.getElementById("page").innerHTML =
'<div class="box"><h2>Login 🔐</h2><input placeholder="Email"><input type="password" placeholder="Password"><button onclick="alert(\'Login button works!\')">Login</button></div>';
}

function showSignup(){
document.getElementById("page").innerHTML =
'<div class="box"><h2>Create Account 📝</h2><input placeholder="Name"><input placeholder="Email"><input type="password" placeholder="Password"><button onclick="alert(\'Sign Up button works!\')">Create Account</button></div>';
}
<script>
function showHome() {
  document.getElementById("page").innerHTML =
    "<h2>Welcome Home 🏠</h2><p>Welcome to Nova Market!</p>";
}

function showLogin() {
  document.getElementById("page").innerHTML =
    '<div class="box">' +
    '<h2>Login 🔐</h2>' +
    '<input id="loginEmail" placeholder="Email">' +
    '<input id="loginPassword" type="password" placeholder="Password">' +
    '<button onclick="loginAccount()">Login</button>' +
    '<p id="loginMessage"></p>' +
    '</div>';
}

function showSignup() {
  document.getElementById("page").innerHTML =
    '<div class="box">' +
    '<h2>Create Account 📝</h2>' +
    '<input id="signupName" placeholder="Name">' +
    '<input id="signupEmail" placeholder="Email">' +
    '<input id="signupPassword" type="password" placeholder="Password">' +
    '<button onclick="createAccount()">Create Account</button>' +
    '<p id="signupMessage"></p>' +
    '</div>';
}

function createAccount() {
  let name = document.getElementById("signupName").value;
  let email = document.getElementById("signupEmail").value;
  let password = document.getElementById("signupPassword").value;

  if (!name ⠞⠵⠵⠺⠵⠺⠟⠵ !password) {
    document.getElementById("signupMessage").innerText =
      "Please fill in everything.";
    return;
  }

  localStorage.setItem("novaName", name);
  localStorage.setItem("novaEmail", email);
  localStorage.setItem("novaPassword", password);

  document.getElementById("signupMessage").innerText =
    "Account created successfully! 🎉";

  setTimeout(showLogin, 1000);
}

function loginAccount() {
  let email = document.getElementById("loginEmail").value;
  let password = document.getElementById("loginPassword").value;

  let savedEmail = localStorage.getItem("novaEmail");
  let savedPassword = localStorage.getItem("novaPassword");
  let savedName = localStorage.getItem("novaName");

  if (email === savedEmail && password === savedPassword) {
    document.getElementById("loginMessage").innerText =
      "Welcome back, " + savedName + "! 🎉";
  } else {
    document.getElementById("loginMessage").innerText =
      "Email or password is incorrect.";
  }
}
</script>

</body>
</html>
