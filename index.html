<!DOCTYPE html>
<html>
<head>
<title>Nova Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
header{background:#111;color:white;padding:20px;text-align:center}
button{padding:12px 20px;margin:5px;border:0;border-radius:6px;background:white;color:#111;cursor:pointer}
main{text-align:center;padding:30px}
.box{background:white;padding:25px;max-width:350px;margin:auto;border-radius:10px}
input{display:block;width:90%;padding:12px;margin:10px auto}
</style>
</head>

<body>

<header>
<h1>🚀 Nova Market</h1>
<button onclick="showHome()">Home</button>
<button onclick="showLogin()">Login</button>
<button onclick="showSignup()">Sign Up</button>
</header>

<main id="page">
<h2>Welcome to Nova Market 🛒</h2>
<p>Buy and sell amazing products.</p>
</main>

<script>
function showHome(){
document.getElementById("page").innerHTML =
"<h2>Welcome Home 🏠</h2><p>Welcome to Nova Market!</p>";
}

function showLogin(){
document.getElementById("page").innerHTML =
'<div class="box"><h2>Login 🔐</h2><input placeholder="Email"><input type="password" placeholder="Password"><button onclick="alert(\'Login button works!\')">Login</button></div>';
}

function showSignup(){
document.getElementById("page").innerHTML =
'<div class="box"><h2>Create Account 📝</h2><input placeholder="Name"><input placeholder="Email"><input type="password" placeholder="Password"><button onclick="alert(\'Sign Up button works!\')">Create Account</button></div>';
}
</script>

</body>
</html>
